
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSort | Create Profile</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#071b2b,#123d50);
  color: white;
  min-height: 100vh;
  display: grid;
  place-items: center;
}
.profile-box {
  width: 90%;
  max-width: 480px;
  padding: 30px;
  background: #102d40;
  border-radius: 18px;
  border: 1px solid #24758a;
}
h1 { text-align: center; }
h1 span { color: #13c6dc; }
input, textarea {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border-radius: 8px;
  border: 1px solid #477184;
  background: #183e52;
  color: white;
}
button {
  width: 100%;
  padding: 14px;
  background: #13c6dc;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}
</style>
</head>
<body>

<div class="profile-box">
  <h1>ECO<span>SORT</span></h1>
  <h2>Create Your Profile</h2>

  <form id="profileForm">
    <input id="name" placeholder="Full Name" required>
    <input id="phone" type="tel"
      placeholder="Mobile Number" pattern="[0-9]{10}" required>
    <input id="city" placeholder="City" required>
    <input id="state" placeholder="State" required>
    <textarea id="address" placeholder="Full Address" required></textarea>
    <button type="submit">Save Profile</button>
  </form>
</div>

<script>
if (!localStorage.getItem("ecosortEmail")) {
  window.location.href = "login.html";
}

document.getElementById("profileForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const profile = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    city: document.getElementById("city").value,
    state: document.getElementById("state").value,
    address: document.getElementById("address").value
  };

  localStorage.setItem("ecosortProfile", JSON.stringify(profile));

  window.location.href = "dashboard.html";
});
</script>

</body>
</html>
